UserID                zextras:zextras
UMask                 022
Socket                inet:8465@[127.0.0.1]
PidFile               /run/carbonio/opendkim.pid

LDAPBindUser		uid=zmpostfix,cn=appaccts,cn=zimbra
LDAPBindPassword	GOLDEN-ldap-postfix-password
LDAPUseTLS		0
LDAPTimeout             30
LDAPKeepaliveIdle       240
LDAPKeepaliveProbes     10
LDAPKeepaliveInterval   30
SigningTable		ldap://127.0.0.1:389/?DKIMSelector?sub?(DKIMIdentity=$d)
KeyTable		ldap://127.0.0.1:389/?DKIMDomain,DKIMSelector,DKIMKey,?sub?(DKIMSelector=$d)
Canonicalization	relaxed/relaxed
ReportAddress
SignHeaders		message-id,date,from,mime-version,to

On-BadSignature       accept
On-DNSError           tempfail
On-InternalError      tempfail
On-NoSignature        accept
On-Security           tempfail

AllowSHA1Only         no
AlwaysAddARHeader     no
AuthservIDWithJobId   yes
AutoRestart           yes
AutoRestartCount      20
AutoRestartRate       10/1h
Background            Yes
ClockDrift            300
DisableCryptoInit     yes
DNSTimeout            10
DomainKeysCompat      no
EnableCoredumps       yes
FixCRLF               no
MaximumHeaders        65536
Minimum               0
Mode                  s
MultipleSignatures    no
NoHeaderB             no
RequireSafeKeys       Yes
SignatureAlgorithm    rsa-sha256
SignatureTTL          0
StrictHeaders         no
StrictTestMode        no
SubDomains            no
InternalHosts         file:/opt/zextras/conf/opendkim-localnets.conf

SendReports           no
Diagnostics           no
LogWhy                yes
Quarantine            no
ResolverTracing       no
Syslog                yes
SyslogFacility        LOCAL0
SyslogSuccess         no
SoftwareHeader        yes
TemporaryDirectory    /opt/zextras/data/tmp
KeepTemporaryFiles    no
MilterDebug           0
