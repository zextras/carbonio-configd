# Staging area configd fills for /opt/zextras/libexec/carbonio-postfix-conf apply
# (CO-4621). Parent data/postfix is root-owned (carbonio-postfix tmpfiles, or
# created root-owned here), so no unsafe path transition. Applied by this
# package's postinst when the zextras user exists, and by carbonio-core's
# postinst (it runs every carbonio-*.conf) on a fresh install.
d /opt/zextras/data/postfix/conf-staging 0700 zextras zextras
