# Opt-in drop-in for carbonio-configd.service: NOT installed automatically.
#
# Use it only on a systemd host where the Carbonio targets are NOT enabled
# (carbonio-directory-server, -appserver, -proxy, -mta, service-discover), so
# configd runs in legacy mode: it starts, stops and restarts the services itself
# (nginx, postfix, mailboxd, mysqld, clamd, ...) through the zm*ctl scripts,
# nginx and sudo, as the unsandboxed legacy zmconfigd did, and the services are
# children of the daemon, in its cgroup. The shipped unit is hardened for the
# supported layout, where systemd runs every service as a unit of its own and
# configd only calls systemctl; under it a legacy-mode daemon logs a WARN at
# startup and its sudo and nginx execs fail.
#
#   install -D -m 644 /usr/share/carbonio-configd/systemd/legacy-mode.conf \
#       /etc/systemd/system/carbonio-configd.service.d/legacy-mode.conf
#   systemctl daemon-reload && systemctl restart carbonio-configd
#
# See docs/systemd.md ("Legacy mode on a systemd host"). To undo, delete the file
# and reload. configd itself never gets ambient capabilities.

[Service]
# Services are children of the daemon: stopping or restarting configd (a package
# upgrade does) must signal only the daemon. mixed/control-group would SIGKILL
# every service in the cgroup, which the legacy zmconfigd never did. systemd logs
# "remains running after unit stopped" for them; that is expected.
KillMode=process

# The cgroup limits would apply to the services in the cgroup as well: clamd
# (~1.5 GB of signatures) was throttled by MemoryHigh until its start timed out,
# and mailboxd/mysqld would be OOM-killed or hit TasksMax.
MemoryHigh=infinity
MemoryMax=infinity
CPUQuota=
TasksMax=infinity

# The services keep their state under /opt/zextras (db, store, index, redolog,
# zmstat, jetty, mta and antivirus data), not only conf, log and data.
ReadWritePaths=
ReadWritePaths=-/opt/zextras -/run/carbonio

# Status of services that sudo started as root (postfix master, amavis-mc) reads
# /proc/<pid> of root-owned processes.
ProtectProc=default

# sudo is setuid root (sudoers of zextras: postfix with exact verbs, postalias
# /etc/aliases, postsuper, postcat, qshape.pl, amavis-mc, zmmailboxdmgr, zmqstat,
# zmstat-fd, ... and /opt/zextras/libexec/postfix-conf, the root helper
# that applies Postfix configuration staged by configd; in legacy mode configd runs
# it as "sudo -n postfix-conf apply") and nginx carries file capabilities (cap_net_bind_service=ep, to bind
# 80/443). Both need privileges to be gainable on exec:
#  - no-new-privileges makes the kernel ignore setuid bits and file capabilities;
#  - with User=zextras systemd also sets it for every directive implemented with
#    a seccomp filter, whatever NoNewPrivileges= says: PrivateDevices,
#    ProtectKernel{Modules,Tunables,Logs}, ProtectClock, ProtectHostname,
#    RestrictRealtime, RestrictSUIDSGID, RestrictNamespaces,
#    RestrictAddressFamilies, LockPersonality, SystemCallFilter and
#    SystemCallArchitectures, so each of them is switched off here.
NoNewPrivileges=no
RestrictSUIDSGID=no
RestrictRealtime=no
RestrictNamespaces=no
LockPersonality=no
PrivateDevices=no
ProtectKernelModules=no
ProtectKernelTunables=no
ProtectKernelLogs=no
ProtectClock=no
ProtectHostname=no
RestrictAddressFamilies=
SystemCallArchitectures=
SystemCallFilter=
SystemCallErrorNumber=

# An empty bounding set makes exec of a binary whose file capabilities are not all
# in the set fail with EPERM ("fork/exec .../nginx: operation not permitted"), and
# sudo needs CAP_SETUID, CAP_SETGID and CAP_AUDIT_WRITE. A deny list instead of an
# allow list, because what is exec'd (nginx, sudo, postfix, the zm*ctl scripts)
# needs an open-ended set: it denies what nothing here has a use for, including
# what PrivateDevices, ProtectKernelModules, ProtectClock and ProtectKernelLogs
# would have taken away.
# "CapabilityBoundingSet=~" first: an empty assignment would keep the empty set of
# the shipped unit (a "~" list is ANDed with it), "~" alone resets to all.
CapabilityBoundingSet=~
CapabilityBoundingSet=~CAP_SYS_BOOT CAP_SYS_PACCT CAP_SYS_TTY_CONFIG CAP_LINUX_IMMUTABLE CAP_BPF CAP_PERFMON CAP_MAC_ADMIN CAP_MAC_OVERRIDE CAP_AUDIT_CONTROL CAP_AUDIT_READ CAP_WAKE_ALARM CAP_BLOCK_SUSPEND CAP_SYS_MODULE CAP_SYS_TIME CAP_SYSLOG CAP_SYS_RAWIO CAP_MKNOD
