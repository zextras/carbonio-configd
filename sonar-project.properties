sonar.projectKey=carbonio-configd
sonar.projectName=carbonio-configd
# lcdocs.go and lcdefaults.go are generated from LC.java by scripts/gen-lc.py.
sonar.exclusions=**/*_test.go,test/**,internal/localconfig/lcdocs.go,internal/localconfig/lcdefaults.go
sonar.test.inclusions=**/*_test.go
sonar.coverage.exclusions=internal/testutil/**,test/**
sonar.go.golangci-lint.reportPaths=linter.out
sonar.go.coverage.reportPaths=coverage.out
