sonar.projectKey=carbonio-configd
sonar.projectName=carbonio-configd
# lcdocs.go and lcdefaults.go are generated from LC.java by scripts/gen-lc.py.
sonar.exclusions=**/*_test.go,test/**,internal/localconfig/lcdocs.go,internal/localconfig/lcdefaults.go,scripts/lc-source/**
sonar.test.inclusions=**/*_test.go
# scripts/ holds dev-time generators (not shipped); make generate-check guards their output.
sonar.coverage.exclusions=internal/testutil/**,test/**,scripts/**
sonar.go.golangci-lint.reportPaths=linter.out
# coverage.out is the default tags; the others cover the tracing/profiling-only files (Jenkins 'Tests' stage).
sonar.go.coverage.reportPaths=coverage.out,coverage.tracing.out,coverage.profiling.out,coverage.full.out
