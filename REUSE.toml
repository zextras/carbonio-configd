path = ["docker/configd/description.md"]
SPDX-FileCopyrightText = "2026 Zextras <https://www.zextras.com>"
SPDX-License-Identifier = "AGPL-3.0-only"

# Verbatim carbonio-mailbox sources vendored for scripts/gen-lc.py (GPL-2.0-only, as in
