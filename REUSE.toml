path = ["scripts/lc-source/ZsMsg.properties", "scripts/lc-source/TAG"]
SPDX-FileCopyrightText = ["2022 Synacor, Inc.", "2022 Zextras <https://www.zextras.com>"]
SPDX-License-Identifier = "GPL-2.0-only"

# Synthetic templates and fixtures of the proxy template tools' tests: plain
